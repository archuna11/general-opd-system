{% extends "base.html" %}
{% block body %}
  <h1>Admin Console</h1>

  <div class="card">
    <h2><span class="icon">⚙️</span>User Management</h2>
    <form method="post" class="row">
      <input type="hidden" name="action" value="add_user">
      <div class="col-2"><label>Username</label><input name="um_user" type="text" required></div>
      <div class="col-2"><label>Password</label><input name="um_pass" type="text" required></div>
      <div class="col-2"><label>Role</label>
        <select name="um_role">
          <option>Admin</option><option>Doctor</option><option>Lab</option><option>IT Exec</option>
        </select>
      </div>
      <div style="align-self:flex-end;"><button class="btn" type="submit">Add User</button></div>
    </form>
    <table class="table" style="margin-top:14px;">
      <thead><tr><th>Username</th><th>Role</th><th></th></tr></thead>
      <tbody>
        {% for u in users %}
        <tr>
          <td>{{ u.username }}</td>
          <td><span class="pill">{{ u.role }}</span></td>
          <td>
            <form method="post" style="display:inline;">
              <input type="hidden" name="action" value="del_user">
              <input type="hidden" name="user_id" value="{{ u.id }}">
              <button class="btn-outline" onclick="return confirm('Remove user?')">Remove</button>
            </form>
          </td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
{% endblock %}
