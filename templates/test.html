{% extends "base.html" %}
{% block body %}
<h1>Consultation</h1>

<!-- Patient Demographics -->
<div class="card">
  <h2><span class="icon">🧍</span>Patient Demographics</h2>

  <!-- First Row: UHID + Fetch Button -->
  <div class="row" style="align-items:flex-end;">
    <div class="col">
      <label>UHID</label>
      <input type="text" id="c_uhid" placeholder="Enter UHID"/>
      <input type="hidden" id="c_uhid_hidden" name="c_uhid_hidden"/>
    </div>
    <div class="col">
      <button type="button" id="btnFetch">Fetch</button>
    </div>
  </div>

  <!-- Demographics Display -->
  <div id="demoCard" style="display:none; margin-top:10px;">
    <p><strong>Name:</strong> <span id="d_name"></span></p>
    <p><strong>Age:</strong> <span id="d_age"></span></p>
    <p><strong>Gender:</strong> <span id="d_gender"></span></p>
  </div>
</div>

<!-- Summary Card (Last Consultation) -->
<div class="card" id="summaryCard" style="display:none; margin-top:15px;">
  <h2><span class="icon">📋</span>Last Consultation Summary</h2>
  <div><strong>Date:</strong> <span id="s_date"></span></div>
  <div><strong>Chief Complaints:</strong> <span id="s_cc"></span></div>
  <div><strong>Past History:</strong> <span id="s_pmh"></span></div>
  <div><strong>Medication History:</strong> <span id="s_pmxh"></span></div>
  <div><strong>Allergy:</strong> <span id="s_allergy"></span></div>
  <div><strong>Provisional Dx:</strong> <span id="s_dx"></span></div>
</div>

<!-- Consultation Form -->
<form method="POST">
  <input type="hidden" name="c_uhid_hidden" id="c_uhid_hidden_form"/>

  <div class="card">
    <h2><span class="icon">📝</span>Consultation Details</h2>

    <div class="row">
      <div class="col">
        <label>Blood Pressure</label>
        <input type="text" name="v_bp"/>
      </div>
      <div class="col">
        <label>Temperature</label>
        <input type="text" name="v_temp"/>
      </div>
      <div class="col">
        <label>SPO₂</label>
        <input type="text" name="v_spo2"/>
      </div>
      <div class="col">
        <label>Pulse</label>
        <input type="text" name="v_pulse"/>
      </div>
      <div class="col">
        <label>Respiratory Rate</label>
        <input type="text" name="v_rr"/>
      </div>
    </div>

    <div class="row">
      <div class="col">
        <label>Chief Complaints</label>
        <textarea name="cc"></textarea>
      </div>
      <div class="col">
        <label>Past Medical History</label>
        <textarea name="pmh"></textarea>
      </div>
    </div>

    <div class="row">
      <div class="col">
        <label>Past Medication History</label>
        <textarea name="pmxh"></textarea>
      </div>
      <div class="col">
        <label>Surgical History</label>
        <textarea name="surgical"></textarea>
      </div>
    </div>

    <div class="row">
      <div class="col">
        <label>Family History</label>
        <textarea name="family"></textarea>
      </div>
      <div class="col">
        <label>Allergy</label>
        <textarea name="allergy"></textarea>
      </div>
    </div>

    <div class="row">
      <div class="col">
        <label>OBGYN History</label>
        <textarea name="obgyn"></textarea>
      </div>
      <div class="col">
        <label>Social History</label>
        <textarea name="social"></textarea>
      </div>
    </div>

    <div class="row">
      <div class="col">
        <label>Cardio</label>
        <textarea name="cardio"></textarea>
      </div>
      <div class="col">
        <label>Respiratory</label>
        <textarea name="resp"></textarea>
      </div>
    </div>

    <div class="row">
      <div class="col">
        <label>Abdomen</label>
        <textarea name="abdomen"></textarea>
      </div>
      <div class="col">
        <label>CNS</label>
        <textarea name="cns"></textarea>
      </div>
    </div>

    <div class="row">
      <div class="col">
        <label>MSK</label>
        <textarea name="msk"></textarea>
      </div>
      <div class="col">
        <label>Provisional Diagnosis</label>
        <textarea name="provisional_dx"></textarea>
      </div>
    </div>

    <div class="row" style="margin-top:15px;">
      <button type="submit">Save Consultation</button>
    </div>
  </div>
</form>

<script>
document.getElementById("btnFetch").addEventListener("click", async function() {
  const uhid = document.getElementById("c_uhid").value.trim();
  if(!uhid) return;

  // Store in hidden inputs
  document.getElementById("c_uhid_hidden").value = uhid;
  document.getElementById("c_uhid_hidden_form").value = uhid;

  // --- Fetch demographics ---
  const pd = await fetch("/api/patient/" + encodeURIComponent(uhid));
  if(pd.ok){
    const p = await pd.json();
    document.getElementById("demoCard").style.display = "block";
    document.getElementById("d_name").innerText = p.name || '';
    document.getElementById("d_age").innerText = p.age || '';
    document.getElementById("d_gender").innerText = p.gender || '';
  }

  // --- Fetch last consultation summary ---
  const rc = await fetch("/api/consultations/" + encodeURIComponent(uhid));
  if(rc.ok){
    const cons = await rc.json();
    if(cons){
      document.getElementById("summaryCard").style.display = "block";
      document.getElementById("s_date").innerText = cons.date || '';
      document.getElementById("s_cc").innerText = cons.cc || '';
      document.getElementById("s_pmh").innerText = cons.pmh || '';
      document.getElementById("s_pmxh").innerText = cons.pmxh || '';
      document.getElementById("s_allergy").innerText = cons.allergy || '';
      document.getElementById("s_dx").innerText = cons.provisional_dx || '';
    }
  }
});
</script>
{% endblock %}
