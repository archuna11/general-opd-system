<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Radiology — Queue</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background: #f8fafc; }
    .spinner { border: 3px solid rgba(0,0,0,0.06); width: 16px; height: 16px; border-radius: 999px; border-left-color: #2563eb; animation: spin 1s linear infinite; display:inline-block; }
    @keyframes spin { to { transform: rotate(360deg); } }
    /* modal viewer styles */
    #viewer-modal.hidden { display: none; }
  </style>
</head>
<body class="min-h-screen font-sans text-gray-900">
  <nav class="bg-white shadow">
    <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
      <div class="font-bold">Radiology Queue</div>
      <div class="space-x-3">
        <a href="{{ url_for('radiology_request') }}" class="text-sm text-indigo-600">Submit</a>
        <a href="{{ url_for('view_queue_page') }}" class="text-sm text-gray-600">View</a>
      </div>
    </div>
  </nav>

  <main class="max-w-6xl mx-auto p-6">
    <div class="bg-white rounded shadow p-4 mb-6">
      <div class="flex justify-between items-center">
        <h2 class="text-xl font-semibold">Request Queue</h2>
        <div class="text-sm text-gray-500">Realtime (in-memory)</div>
      </div>
    </div>

    <div id="queue-container" class="space-y-4"></div>
  </main>

  <!-- Viewer modal -->
  <div id="viewer-modal" class="fixed inset-0 bg-black bg-opacity-70 flex items-center justify-center hidden">
    <div class="bg-white rounded-lg w-full max-w-4xl h-[80vh] overflow-hidden">
      <div class="flex items-center justify-between p-3 border-b">
        <div class="font-semibold">DICOM Viewer</div>
        <button id="close-viewer" class="text-xl px-3">×</button>
      </div>
      <div id="dicomViewport" class="w-full h-full bg-black"></div>
    </div>
  </div>

  <!-- Cornerstone libs for DICOM viewing -->
  <script src="https://unpkg.com/cornerstone-core@2.3.0/dist/cornerstone.js"></script>
  <script src="https://unpkg.com/dicom-parser@1.8.7/dist/dicomParser.js"></script>
  <script src="https://unpkg.com/cornerstone-wado-image-loader@3.1.2/dist/cornerstoneWADOImageLoader.js"></script>

  <script>
    // initialize cornerstone wado loader
    try {
      cornerstoneWADOImageLoader.webWorkerManager.initialize({
        maxWebWorkers: navigator.hardwareConcurrency || 1,
        startWebWorkersOnDemand: true
      });
      cornerstoneWADOImageLoader.external.cornerstone = cornerstone;
    } catch (e) { console.warn("cornerstone init", e); }

    const queueContainer = document.getElementById('queue-container');
    const modal = document.getElementById('viewer-modal');
    const viewport = document.getElementById('dicomViewport');

    function renderQueue(list) {
      if (!list || list.length === 0) {
        queueContainer.innerHTML = '<div class="bg-white p-6 rounded shadow text-center text-gray-500">No requests in queue.</div>';
        return;
      }

      let html = '';
      for (const r of list) {
        const when = new Date(r.timestamp).toLocaleString();
        const status = r.status || 'Pending';
        const statusBadge = status === 'Completed' ? '<span class="text-green-600 text-sm">Completed</span>' :
                            status === 'Failed' ? '<span class="text-red-600 text-sm">Failed</span>' :
                            (status === 'Queued' || status === 'Pending') ? '<span class="text-blue-600 text-sm">Queued</span>' :
                            '<span class="text-gray-600 text-sm">' + status + '</span>';
        const spinner = (status === 'Pending' || status === 'Queued') ? '<span class="spinner mr-2"></span>' : '';
        const viewBtn = (status === 'Completed' && r.filename) ? `<button data-filename="${r.filename}" class="view-btn bg-green-600 text-white px-3 py-1 rounded text-sm">View</button>` : '';
        const err = r.error ? `<div class="text-xs text-red-600 mt-1">Error: ${r.error}</div>` : '';
        html += `
          <div class="bg-white p-4 rounded shadow flex justify-between items-start">
            <div>
              <div class="text-sm text-gray-600">${spinner}<strong>UHID:</strong> ${r.uhid} <span class="text-xs text-gray-400">• ${when}</span></div>
              <div class="text-sm text-gray-700 mt-1">${r.scan_type} — ${r.body_part}</div>
              ${err}
            </div>
            <div class="flex flex-col items-end gap-2">
              ${statusBadge}
              ${viewBtn}
            </div>
          </div>
        `;
      }
      queueContainer.innerHTML = html;
    }

    async function fetchQueue() {
      try {
        const res = await fetch('{{ url_for("queue_status") }}');
        if (!res.ok) return;
        const q = await res.json();
        renderQueue(q);
      } catch (e) { console.error(e); }
    }

    // show viewer
    async function showViewer(filename) {
      if (!filename) return;
      modal.classList.remove('hidden');

      try {
        cornerstone.enable(viewport);
      } catch (e) {}

      const imageId = `wadouri:${window.location.origin}/radiology/dicom/${encodeURIComponent(filename)}`;

      try {
        const image = await cornerstone.loadAndCacheImage(imageId);
        cornerstone.displayImage(viewport, image);
      } catch (err) {
        viewport.innerHTML = '<div class="p-4 text-red-400">Failed to load DICOM. Check server or file.</div>';
        console.error('cornerstone load err', err);
      }
    }

    document.addEventListener('click', (ev) => {
      const btn = ev.target.closest('.view-btn');
      if (btn) {
        const filename = btn.dataset.filename;
        showViewer(filename);
      }
      if (ev.target.id === 'close-viewer' || ev.target === modal) {
        try { cornerstone.disable(viewport); } catch(e){}
        viewport.innerHTML = '';
        modal.classList.add('hidden');
      }
    });

    window.addEventListener('load', () => {
      fetchQueue();
      setInterval(fetchQueue, 10000); // refresh every 10s
    });
  </script>
</body>
</html>
